<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Weekly Meal Planner</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 12px; color: #000; font-size: 10px; }
        .card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .day-box { background: #f8fafc; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 8px; }
        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 4px; }
        .day-name { font-weight: bold; color: #1e3a8a; text-transform: uppercase; }
        .toggle-btn { padding: 4px 8px; font-size: 10px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-add { background: #2563eb; color: white; }
        .btn-remove { background: #64748b; color: white; }
        .flex-row { display: flex; gap: 6px; margin-bottom: 4px; }
        .meal-select-container { margin-top: 2px; display: block; margin-bottom: 6px; }
        .m2-wrapper { display: none; margin-top: 8px; border-top: 1px dashed #e2e8f0; padding-top: 4px; }
        select { padding: 6px; width: 100%; border: 1px solid #94a3b8; border-radius: 4px; font-size: 10px; font-weight: bold; background: white; color: #000; }
        label { display: block; font-size: 10px; color: #333; margin-top: 2px; font-weight: bold; }
    </style>
</head>
<body>
    <div style="background: linear-gradient(to right, #1e3a8a, #2563eb); color: white; padding: 12px; border-radius: 10px; margin-bottom: 12px;">
        <h1 style="font-size:12px; margin:0; text-transform:uppercase;">Ultimate Weekly Meal Planner</h1>
    </div>
    <div class="card">
        <h2>📅 Weekly Custom Schedule Mixer</h2>
        <div id="weekContainer"></div>
    </div>
    <div class="card">
        <h2>🍽 Active Recipes & Cooking Directions</h2>
        <div id="recipeBox"><p style='font-size:10px; color:#666;'>Select your options above to view cooking instructions.</p></div>
    </div>
    <div class="card">
        <h2>🛒 Complete Weekly Grocery Checklist</h2>
        <div id="groceryBox"><p style='font-size:10px; color:#666;'>Select your options above to compile checklists.</p></div>
    </div>
    <script src="engine-v1.js"></script>
    <script src="calculator.js"></script>
    <script src="liquid-total.js"></script>
    <script src="recipes.js"></script>
</body>
</html>
