<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Weekly Meal Planner</title>
    <link rel="stylesheet" href="style-v1.css">
</head>
<body>
    <div class="header-card">
        <h1>Ultimate Weekly Meal Planner</h1>
        <p>1,000 Recipe Matrix Engine with Live Automated Calorie Budget Counters</p>
    </div>
    <div class="tracker-dashboard">
        <div class="tracker-metric">WEEKLY TOTAL TRACK<div id="weeklyTotalVal" class="tracker-val">0 CAL</div></div>
        <div class="tracker-divider"></div>
        <div class="tracker-metric">DAILY AVERAGE TARGET<div id="dailyAvgVal" class="tracker-val">0 CAL</div></div>
    </div>
    <div class="card">
        <h2>📅 Weekly Custom Schedule Mixer</h2>
        <div id="weekContainer"></div>
    </div>
    <div class="card">
        <h2>🍽 Active Recipes & Cooking Directions</h2>
        <div id="recipeBox"></div>
    </div>
    <div class="card">
        <h2>🛒 Complete Weekly Grocery Checklist</h2>
        <div id="groceryBox"></div>
    </div>
    <script src="engine-v1.js"></script>
</body>
</html>
