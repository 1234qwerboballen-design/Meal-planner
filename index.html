<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Weekly Meal Planner</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 12px; color: #000; font-size: 10px; }
        .card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .day-box { background: #f8fafc; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 8px; }
        .day-name { font-weight: bold; color: #1e3a8a; text-transform: uppercase; margin-bottom: 6px; }
        .flex-row { display: flex; gap: 6px; }
        select { padding: 6px; width: 100%; border: 1px solid #94a3b8; border-radius: 4px; font-size: 10px; font-weight: bold; background: white; color: #000; }
    </style>
</head>
<body>
    <div style="background: linear-gradient(to right, #1e3a8a, #2563eb); color: white; padding: 12px; border-radius: 10px; margin-bottom: 12px;">
        <h1 style="font-size:12px; margin:0; text-transform:uppercase;">Ultimate Weekly Meal Planner</h1>
    </div>
    <div class="card">
        <h2>📅 Weekly Custom Schedule Mixer</h2>
        <div id="weekContainer"></div>
    </div>
<script>
    var days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    var styles = ["Chinese / Asian", "Mexican / TexMex", "Italian / Med", "American Comfort", "Diner Breakfast"];
    var proteins = ["Chicken", "Beef", "Turkey", "Seafood", "Pork"];
    var html = "";
    for (var d = 0; d < days.length; d++) {
        var sOpt = '<option>-- Style --</option>'; for(var i=0; i<styles.length; i++) sOpt+='<option>'+styles[i]+'</option>';
        var pOpt = '<option>-- Protein --</option>'; for(var j=0; j<proteins.length; j++) pOpt+='<option>'+proteins[j]+'</option>';
        html += '<div class="day-box"><div class="day-name">'+days[d]+'</div><div class="flex-row"><select>'+sOpt+'</select><select>'+pOpt+'</select></div></div>';
    }
    document.getElementById("weekContainer").innerHTML = html;
</script>
</body>
</html>
